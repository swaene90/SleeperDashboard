name: Build and Run C# App

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --no-restore

      - name: Run Application with Secret
        run: dotnet run
        env:
          SLEEPER_DB_API_KEY: ${{ secrets.SLEEPER_DB_API_KEY }}